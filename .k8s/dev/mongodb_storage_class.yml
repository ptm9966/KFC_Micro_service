apiVersion: storage.k8s.io/v1 
kind: StorageClass
metadata:
  name: mongodb-sc
#provisioner: ebs.csi.aws.com
#parameters:
#  type: gp3
#  fsType: ext4
#provisioner for azure
provisioner: disk.csi.azure.com
parameters:
