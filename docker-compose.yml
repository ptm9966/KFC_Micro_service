services:
  # MongoDB Database for main application
  carts-mongodb:
    image: mongo:7.0
    container_name: kfc-mongodb
    restart: always
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123456
      MONGO_INITDB_DATABASE: carts-database
    volumes:
      - cart_mongodb_data:/data/db
      - cart_mongodb_config:/data/configdb
    networks:
      - kfc-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s

  # MongoDB Database for orders microservice
  orders-mongodb:
    image: mongo:7.0
    container_name: orders-mongodb
    restart: always
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123456
      MONGO_INITDB_DATABASE: orders-database
    volumes:
      - orders_mongodb_data:/data/db
      - orders_mongodb_config:/data/configdb
    networks:
      - kfc-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s

  # Cart Microservice
  cart-service:
    build:
      context: ./cartMicroservice
      dockerfile: Dockerfile
    container_name: kfc-cart-service
    restart: always
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DB_URL: mongodb://admin:admin123456@carts-mongodb:27017/carts-database?authSource=admin
      FRONTEND_URL: http://localhost:3000
    depends_on:
      carts-mongodb:
        condition: service_healthy
    networks:
      - kfc-network
    volumes:
      - ./cartMicroservice:/app
      - /app/node_modules
    healthcheck:
      test: curl -f http://localhost:8080/api/cart || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Orders Microservice
  orders-service:
    build:
      context: ./OrdersMicroservice
      dockerfile: Dockerfile
    container_name: orders-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      NODE_ENV: production
      PORT: 8081
      DB_URL: mongodb://admin:admin123456@orders-mongodb:27017/orders-database?authSource=admin
    depends_on:
      orders-mongodb:
        condition: service_healthy
    networks:
      - kfc-network
    volumes:
      - ./OrdersMicroservice:/app
      - /app/node_modules
    healthcheck:
      test: curl -f http://localhost:8081/api/orders || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Database for users microservice
  users-mongodb:
    image: mongo:7.0
    container_name: users-mongodb
    restart: always
    ports:
      - "27020:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123456
      MONGO_INITDB_DATABASE: users-database
    volumes:
      - users_mongodb_data:/data/db
      - users_mongodb_config:/data/configdb
    networks:
      - kfc-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s

  # User/Auth Microservice
  users-service:
    build:
      context: ./UserMicroservice
      dockerfile: Dockerfile
    container_name: users-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      NODE_ENV: production
      PORT: 8082
      DB_URL: mongodb://admin:admin123456@users-mongodb:27017/users-database?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
    depends_on:
      users-mongodb:
        condition: service_healthy
    networks:
      - kfc-network
    volumes:
      - ./UserMicroservice:/app
      - /app/node_modules
    healthcheck:
      test: curl -f http://localhost:8082/apxti-docs || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Database for products microservice
  products-mongodb:
    image: mongo:7.0
    container_name: products-mongodb
    restart: always
    ports:
      - "27021:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123456
      MONGO_INITDB_DATABASE: products-database
    volumes:
      - products_mongodb_data:/data/db
      - products_mongodb_config:/data/configdb
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - kfc-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 30s

  # Product Microservice
  products-service:
    build:
      context: ./ProductMicroservice
      dockerfile: Dockerfile
    container_name: products-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      NODE_ENV: production
      PORT: 8083
      DB_URL: mongodb://admin:admin123456@products-mongodb:27017/products-database?authSource=admin
    depends_on:
      products-mongodb:
        condition: service_healthy
    networks:
      - kfc-network
    volumes:
      - ./ProductMicroservice:/app
      - /app/node_modules
    healthcheck:
      test: curl -f http://localhost:8083/api-docs || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend React Application
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_CART_SERVICE_URL: http://localhost:8080
        REACT_APP_ORDERS_URL: http://localhost:8081
        REACT_APP_USERS_URL: http://localhost:8082
        REACT_APP_PRODUCTS_URL: http://localhost:8083
    container_name: kfc-frontend
    restart: always
    ports:
      - "3000:80"
    environment:
      REACT_APP_ENV: production
      # Nginx upstream service URLs
      CART_SERVICE_URL: cart-service:8080
      ORDERS_SERVICE_URL: orders-service:8081
      USER_SERVICE_URL: users-service:8082
      PRODUCTS_SERVICE_URL: products-service:8083
    #depends_on:
    #  cart-service:
    #    condition: service_healthy
    #  orders-service:
    #    condition: service_healthy
    #  users-service:
    #    condition: service_healthy
    #  products-service:
    #    condition: service_healthy
    networks:
      - kfc-network
    healthcheck:
      test: curl -f http://localhost/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  cart_mongodb_data:
    driver: local
  cart_mongodb_config:
    driver: local
  orders_mongodb_data:
    driver: local
  orders_mongodb_config:
    driver: local
  users_mongodb_data:
    driver: local
  users_mongodb_config:
    driver: local
  products_mongodb_data:
    driver: local
  products_mongodb_config:
    driver: local

networks:
  kfc-network:
    driver: bridge
