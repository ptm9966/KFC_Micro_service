<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | KFC</title>
    <link rel="stylesheet" href="../assets/styles.css">
  </head>
  <body>
    <main class="auth-shell">
      <div class="brand">KFC Rewards</div>
      <h1>Sign in</h1>
      <p class="subtitle">Enter your email to continue.</p>
      <form>
        <label class="field"><span>Email address</span><input name="identifier" type="email" autocomplete="email" required></label>
        <p class="helper" data-error hidden></p>
        <button type="submit">Continue</button>
      </form>
      <p class="helper">Secured by Auth0.</p>
    </main>
    <script type="module" src="../assets/acul.js"></script>
  </body>
</html>
