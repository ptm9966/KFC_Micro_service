<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password | KFC</title>
    <link rel="stylesheet" href="../assets/styles.css">
  </head>
  <body>
    <main class="auth-shell">
      <div class="brand">KFC Rewards</div>
      <h1>Enter your password</h1>
      <p class="subtitle">Continue securely with your KFC account.</p>
      <form>
        <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
        <p class="helper" data-error hidden></p>
        <button type="submit">Sign in</button>
      </form>
      <p class="helper">Secured by Auth0.</p>
    </main>
    <script type="module" src="../assets/acul.js"></script>
  </body>
</html>
